require:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
Layout/LineLength:
  Max: 100
RSpec:
  Language:
    Include:
      - spec/**/*_spec.rb
RSpec/MultipleDescribes:
  Enabled: false
RSpec/MultipleExpectations:
  Max: 20
Style/StringLiterals:
  EnforcedStyle: double_quotes
  Enabled: true